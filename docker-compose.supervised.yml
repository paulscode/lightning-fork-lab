# A bridge whose SHA256 node Lightning Fork runs for the operator
# (bridgerpc.sha256.supervised), for scenario-supervised.sh.
#
# Shaped like the packages, deliberately:
#
# - lf3-sha256 is the stock lnd image, unmodified, at its own address on the
#   lab network, as on Umbrel: a container joined to another's network
#   namespace loses its network when that one restarts, so the packages that
#   run on Docker cannot share one. lf3 names it with bridgerpc.sha256.rpchost.
#   (StartOS's daemons do share a namespace, which survives restarts; that is
#   the default 127.0.0.1:10019, covered by the unit tests.)
# - It shares lf3's volume, mounted at /lf, and keeps its own lnd directory at
#   sha256-node/ inside it, which is where lf3 looks by default.
# - It starts only once lf3 has written the wallet password file: the platform
#   packages wait for it the same way, which is what keeps the process from
#   doing anything until the bridge is on.
# - Nothing about its wallet, seed or macaroons is set here. lf3 creates the
#   wallet from a seed derived from its own, and bakes the macaroon it uses.
# - The chain node it reads is not on its command line either: as on Umbrel,
#   it is in bridge-sha256.conf in lf3's directory (the dashboard writes it
#   there; scenario-supervised.sh here), the node waits for that file too,
#   reads its chain node by RPC polling, and stops when the file changes or
#   goes, so its restart policy starts it again on what is there. The shell
#   is the Umbrel package's, but for the lab's paths, network and a shorter
#   polling interval. Unlike Umbrel it runs as root (as lf3 does), from the
#   image by tag rather than digest, and with no Tor: it advertises
#   lf3-sha256:9739 instead of an onion of its own, so the Umbrel node's
#   onion is not exercised here.
#
# Layered over docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.supervised.yml up -d lf3 lf3-sha256
services:
  lf3:
    image: lightning-fork:dev
    restart: "no"
    depends_on:
      knots-b2b:
        condition: service_healthy
    networks: [lab]
    command:
      - --noseedbackup
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoin.blake2b-activation-height=${ACTIVATION_HEIGHT:-20}
      - --fee.url=http://fees:8080/fees.json
      - --bitcoind.rpchost=knots-b2b:18443
      - --bitcoind.rpcuser=lab
      - --bitcoind.rpcpass=lab
      - --bitcoind.zmqpubrawblock=tcp://knots-b2b:28332
      - --bitcoind.zmqpubrawtx=tcp://knots-b2b:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --externalip=lf3:9735
      - --tlsextradomain=lf3
      - --alias=lf3
      - --debuglevel=info,BRPC=debug
      - --protocol.simple-taproot-chans
      - --bridgerpc.enabled
      - --bridgerpc.tosha256
      - --bridgerpc.sha256.supervised
      - --bridgerpc.sha256.rpchost=lf3-sha256:10019
      - --bridgerpc.ratesource=fixed
      - --bridgerpc.spread=0.01
      # No rate: the bridge starts and refuses to quote until one is set,
      # which is the first-run state the scenario checks.
    volumes:
      - lf3-data:/root/.lnd

  lf3-sha256:
    image: lightninglabs/lnd:v0.21.4-beta
    restart: unless-stopped
    # As on Umbrel: lnd closes its databases on the way out.
    stop_grace_period: 1m
    networks: [lab]
    depends_on:
      - lf3
      - bitcoind-sha
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pw=/lf/data/chain/bitcoin/regtest/bridge/sha256/wallet.password
        conf=/lf/bridge-sha256.conf
        trap 'exit 0' TERM INT
        until [ -s "$$pw" ] && [ -s "$$conf" ]; do sleep 2 & wait $$!; done
        sum=$$(cksum < "$$conf")
        lnd=""
        trap '[ -n "$$lnd" ] && kill -TERM $$lnd && wait $$lnd; exit 0' TERM INT
        lnd \
          --lnddir=/lf/sha256-node \
          --configfile="$$conf" \
          --bitcoin.regtest \
          --bitcoin.node=bitcoind \
          --bitcoind.rpcpolling \
          --bitcoind.blockpollinginterval=2s \
          --bitcoind.txpollinginterval=2s \
          --rpclisten=0.0.0.0:10019 \
          --restlisten=0.0.0.0:8089 \
          --listen=0.0.0.0:9739 \
          --externalip=lf3-sha256:9739 \
          --tlsextradomain=lf3-sha256 \
          --alias=lf3-sha256 \
          --wallet-unlock-password-file="$$pw" \
          --wallet-unlock-allow-create &
        lnd=$$!
        while kill -0 $$lnd 2>/dev/null; do
          sleep 2 & wait $$!
          if [ "$$({ cksum < "$$conf"; } 2>/dev/null)" != "$$sum" ]; then
            kill -TERM $$lnd; wait $$lnd; exit 0
          fi
        done
        wait $$lnd
    volumes:
      - lf3-data:/lf

volumes:
  lf3-data:
